<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprovação de Conteúdo · Casa Sales</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#747564; --navy:#233442; --ink:#0e1821; --cream:#FDFFF7; --grey:#8B9198;
  --bronze:#9B572B; --champagne:#d98d5f; --line:rgba(253,255,247,.14);
  --ok:#a9c49a;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(120% 70% at 50% 0%,#233442 0%,#0e1821 62%) fixed,var(--ink);color:var(--cream);font-family:'Outfit',sans-serif;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;width:640px;height:640px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(217,141,95,.10),transparent 62%);transform:translate(-50%,-50%);left:50%;top:30%}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
main,header,footer{position:relative;z-index:2}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:20px clamp(20px,5vw,64px);transition:background .5s,backdrop-filter .5s,border-color .5s;border-bottom:1px solid transparent}
.bar.solid{background:rgba(14,24,33,.72);backdrop-filter:blur(18px);border-color:var(--line)}
.logo{font-family:'Outfit',sans-serif;font-weight:300;letter-spacing:.42em;font-size:15px;text-transform:uppercase;color:var(--cream)}
.logo b{font-weight:300;display:inline-block;margin-left:.42em}
.prog{display:flex;align-items:center;gap:14px;font-family:'Outfit';font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:rgba(253,255,247,.7)}
.prog i{display:block;width:120px;height:1px;background:var(--line);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:var(--champagne);transform-origin:left;transform:scaleX(var(--p,0));transition:transform 1s var(--ease)}

/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:120px 24px 80px;position:relative}
.frame{position:absolute;left:50%;top:50%;width:min(560px,86vw);aspect-ratio:1/1.05;transform:translate(-50%,-52%);opacity:.45}
.frame path{fill:none;stroke:url(#g);stroke-width:1;stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 3.6s var(--ease) .3s forwards}
.frame path:nth-child(2){animation-delay:.9s;opacity:.55}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-in{position:relative;max-width:820px}
.eyebrow{font-family:'Outfit';font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--champagne);margin-bottom:34px}
h1{font-family:'Outfit';font-weight:200;text-transform:uppercase;line-height:1.08;letter-spacing:.06em;font-size:clamp(34px,6.4vw,76px)}
h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;text-transform:none;letter-spacing:0;color:var(--champagne);font-size:1.08em}
.lead{margin:34px auto 0;max-width:520px;font-size:16px;line-height:1.85;color:rgba(253,255,247,.72)}
.client{display:inline-flex;align-items:center;gap:14px;margin-top:44px;padding:12px 26px;border:1px solid var(--line);border-radius:100px;
  font-family:'Outfit';font-size:11px;letter-spacing:.3em;text-transform:uppercase;background:rgba(253,255,247,.03);backdrop-filter:blur(6px)}
.client span{width:6px;height:6px;border-radius:50%;background:var(--champagne);box-shadow:0 0 12px var(--champagne);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.scroll{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:'Outfit';font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:rgba(253,255,247,.55)}
.scroll i{width:1px;height:46px;background:linear-gradient(var(--champagne),transparent);animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* items */
.list{padding:40px clamp(20px,5vw,64px) 120px;max-width:1180px;margin:0 auto}
.item{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:clamp(32px,6vw,92px);align-items:center;padding:clamp(56px,9vw,110px) 0;border-top:1px solid var(--line);position:relative}
.item:nth-child(even){grid-template-columns:minmax(0,1fr) minmax(0,360px)}
.item:nth-child(even) .stage{order:2}
.num{position:absolute;top:34px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--champagne);letter-spacing:.1em}
.stage{position:relative;perspective:1200px}
.phone{position:relative;aspect-ratio:9/16;border-radius:26px;overflow:hidden;background:#0a131a;transform-style:preserve-3d;transition:transform .25s ease-out, box-shadow .6s;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(253,255,247,.12)}
.stage::before{content:"";position:absolute;inset:-26px;border-radius:44px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(217,141,95,.55) 85%,transparent 100%);
  filter:blur(22px);opacity:.0;transition:opacity .8s;animation:spin 7s linear infinite;z-index:-1}
.stage:hover::before,.item.done .stage::before{opacity:.55}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.phone video{width:100%;height:100%;object-fit:cover;display:block;background:#0a131a}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(120% 80% at 50% 0%,#2d4254,#0e1821 72%);}
.ph.hide{display:none}
.ph svg{width:46%;opacity:.5}
.ph small{display:block;margin-top:22px;font-family:'Outfit';font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(253,255,247,.5);line-height:2}
.play{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px;border-radius:50%;border:1px solid rgba(253,255,247,.55);
  background:rgba(14,24,33,.35);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;transition:transform .5s var(--ease),opacity .4s,background .4s}
.play::after{content:"";margin-left:5px;border-left:15px solid var(--cream);border-top:9px solid transparent;border-bottom:9px solid transparent}
.play::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--champagne);animation:ring 2.6s infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.play:hover{transform:scale(1.08);background:rgba(14,24,33,.55)}
.phone.playing .play{opacity:0;pointer-events:none}
.ctrl{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .4s}
.phone.playing:hover .ctrl,.phone.paused .ctrl{opacity:1}
.ctrl button{background:none;border:0;color:var(--cream);cursor:pointer;font-size:11px;font-family:'Outfit';letter-spacing:.2em}
.seek{flex:1;height:2px;background:rgba(253,255,247,.25);cursor:pointer;position:relative}
.seek b{position:absolute;inset:0;background:var(--champagne);transform-origin:left;transform:scaleX(0)}

.info .tag{font-family:'Outfit';font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--champagne)}
.info h2{font-family:'Outfit';font-weight:200;text-transform:uppercase;letter-spacing:.07em;line-height:1.15;font-size:clamp(26px,3.6vw,44px);margin:18px 0 30px}
.cap-l{font-family:'Outfit';font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:rgba(253,255,247,.5);margin-bottom:14px;display:flex;align-items:center;gap:14px}
.cap-l::after{content:"";height:1px;width:48px;background:var(--line)}
.cap{font-size:15.5px;line-height:1.95;color:rgba(253,255,247,.82);white-space:pre-line;padding-left:22px;border-left:1px solid rgba(217,141,95,.4)}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:42px}
.opt{position:relative;overflow:hidden;cursor:pointer;padding:20px 18px;border:1px solid var(--line);background:rgba(253,255,247,.025);
  font-family:'Outfit';font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--cream);text-align:center;transition:all .5s var(--ease);isolation:isolate}
.opt::before{content:"";position:absolute;inset:0;background:var(--champagne);transform:translateY(101%);transition:transform .55s var(--ease);z-index:-1}
.opt:hover{border-color:var(--champagne)}
.opt.on{color:#0e1821;border-color:var(--champagne)}
.opt.on::before{transform:none}
.opt.alt.on::before{background:var(--cream)}
.opt svg{width:15px;height:15px;vertical-align:-3px;margin-right:10px;stroke:currentColor;fill:none;stroke-width:1.4}
.box{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease),margin .7s var(--ease);margin-top:0}
.box.open{grid-template-rows:1fr;margin-top:18px}
.box>div{overflow:hidden}
textarea{width:100%;min-height:130px;resize:vertical;padding:20px;background:rgba(253,255,247,.04);border:1px solid var(--line);color:var(--cream);
  font:300 15px/1.7 'Outfit',sans-serif;outline:0;transition:border-color .4s,background .4s}
textarea::placeholder{color:rgba(253,255,247,.38)}
textarea:focus{border-color:var(--champagne);background:rgba(253,255,247,.06)}
.send{margin-top:18px;width:100%;padding:19px;border:0;cursor:pointer;background:var(--olive);color:var(--cream);font-family:'Outfit';font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  transition:background .4s,opacity .4s,transform .3s;position:relative;overflow:hidden}
.send:hover:not(:disabled){background:#898a77}
.send:disabled{opacity:.35;cursor:not-allowed}
.send.load::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--champagne);animation:ld 1s infinite}
@keyframes ld{from{left:-40%}to{left:100%}}
.msg{font-size:12.5px;color:#e6a98a;margin-top:12px;min-height:1em}
.sent{display:none;margin-top:30px;align-items:center;gap:16px;font-family:'Outfit';font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ok)}
.sent svg{width:38px;height:38px;stroke:var(--ok);fill:none;stroke-width:1.2}
.sent circle,.sent path{stroke-dasharray:120;stroke-dashoffset:120}
.item.done .sent{display:flex}
.item.done .sent circle,.item.done .sent path{animation:draw2 1.1s var(--ease) forwards}
.item.done .sent path{animation-delay:.35s}
@keyframes draw2{to{stroke-dashoffset:0}}
.item.done .choice,.item.done .box,.item.done .send,.item.done .msg{display:none}
.sent .again{margin-left:auto;background:none;border:0;border-bottom:1px solid var(--line);color:rgba(253,255,247,.55);cursor:pointer;font:inherit;font-size:10px;letter-spacing:.24em;padding-bottom:3px;text-transform:uppercase}

/* reveal */
.rv{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease),filter 1.1s var(--ease)}
.rv.in{opacity:1;transform:none;filter:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* finale */
.finale{text-align:center;padding:120px 24px 90px;border-top:1px solid var(--line);position:relative}
.finale h3{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:clamp(34px,5vw,58px);line-height:1.15}
.finale p{margin-top:20px;color:rgba(253,255,247,.6);font-size:14.5px}

.finale.all h3{color:var(--champagne)}

@media(max-width:860px){
  .item,.item:nth-child(even){grid-template-columns:1fr}
  .item:nth-child(even) .stage{order:0}
  .stage{max-width:330px;margin:0 auto;width:100%}
  .prog i{width:56px}
  .num{top:22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}}
.logo{display:block;height:15px;width:auto}
.logo img{height:100%;display:block}
.mono{width:74px;margin:0 auto 34px;display:block;opacity:.95}
</style>
</head>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
const params=new URLSearchParams(location.search);
const cliente=(params.get('cliente')||CONFIG.CLIENTE_PADRAO).trim();
$('#clientName').textContent=cliente;
const total=CONFIG.VIDEOS.length; let done=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- build ---------- */
const list=$('#list');
CONFIG.VIDEOS.forEach((v,i)=>{
  const n=String(i+1).padStart(2,'0');
  const el=document.createElement('section');
  el.className='item'; el.dataset.i=i;
  el.innerHTML=`
  <span class="num">${n} — ${String(total).padStart(2,'0')}</span>
  <div class="stage rv">
    <div class="phone">
      <video playsinline preload="metadata" ${v.capa?`poster="${esc(v.capa)}"`:''} src="${esc(v.arquivo)}#t=0.1"></video>
      <div class="ph"><div><svg viewBox="0 0 100 100" fill="none" stroke="#d98d5f" stroke-width=".8"><path d="M10 92 50 8l40 84"/><path d="M28 92 50 40l22 52"/></svg><small>Vídeo ${n}<br>aguardando arquivo</small></div></div>
      <button class="play" aria-label="Reproduzir"></button>
      <div class="ctrl"><button class="pp">Pausar</button><div class="seek"><b></b></div><button class="mu">Som</button></div>
    </div>
  </div>
  <div class="info">
    <p class="tag rv">Vídeo ${n}</p>
    <h2 class="rv d1">${esc(v.titulo)}</h2>
    <p class="cap-l rv d1">Legenda</p>
    <p class="cap rv d2">${esc(v.legenda)}</p>
    <div class="choice rv d3">
      <button class="opt ok" data-v="Aprovado"><svg viewBox="0 0 16 16"><path d="M2 8.5 6 12.5 14 3.5"/></svg>Aprovado</button>
      <button class="opt alt" data-v="Solicitar alteração"><svg viewBox="0 0 16 16"><path d="M2 13.5h3L13.5 5 11 2.5 2.5 11z"/></svg>Quero alteração</button>
    </div>
    <div class="box"><div><textarea placeholder="Conte-nos o que gostaria de ajustar: texto, trecho do vídeo, música, horário…" maxlength="1500"></textarea></div></div>
    <button class="send" disabled>Confirmar resposta</button>
    <p class="msg"></p>
    <div class="sent"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/><path d="M11 20.5l6 6 12-13"/></svg><span class="stxt">Resposta enviada</span><button class="again">Alterar</button></div>
  </div>`;
  list.appendChild(el);
  setup(el,v,n);
});

function setup(el,v,n){
  const vid=$('video',el), phone=$('.phone',el), ph=$('.ph',el);
  const ok=$('.opt.ok',el), alt=$('.opt.alt',el), box=$('.box',el), ta=$('textarea',el), send=$('.send',el), msg=$('.msg',el);
  let choice=null;

  /* video */
  vid.addEventListener('loadeddata',()=>ph.classList.add('hide'));
  vid.addEventListener('error',()=>ph.classList.remove('hide'));
  const play=()=>{ if(vid.error)return; document.querySelectorAll('video').forEach(o=>{if(o!==vid)o.pause()}); vid.paused?vid.play():vid.pause() };
  $('.play',el).onclick=play; vid.onclick=play;
  vid.onplay=()=>{phone.classList.add('playing');phone.classList.remove('paused');$('.pp',el).textContent='Pausar'};
  vid.onpause=()=>{phone.classList.add('paused');$('.pp',el).textContent='Reproduzir'};
  vid.onended=()=>{phone.classList.remove('playing','paused');vid.currentTime=0};
  $('.pp',el).onclick=play;
  $('.mu',el).onclick=e=>{vid.muted=!vid.muted;e.target.textContent=vid.muted?'Som':'Mudo'};
  vid.ontimeupdate=()=>$('.seek b',el).style.transform=`scaleX(${vid.currentTime/(vid.duration||1)})`;
  $('.seek',el).onclick=e=>{const r=e.currentTarget.getBoundingClientRect();vid.currentTime=(e.clientX-r.left)/r.width*vid.duration};

  /* 3D tilt */
  const st=$('.stage',el);
  if(matchMedia('(hover:hover)').matches){
    st.addEventListener('mousemove',e=>{const r=st.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      phone.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg)`});
    st.addEventListener('mouseleave',()=>phone.style.transform='');
  }

  /* choice */
  const pick=c=>{
    choice=c; ok.classList.toggle('on',c==='Aprovado'); alt.classList.toggle('on',c!=='Aprovado');
    box.classList.toggle('open',c!=='Aprovado'); if(c!=='Aprovado')setTimeout(()=>ta.focus({preventScroll:true}),500);
    send.disabled=false; msg.textContent='';
  };
  ok.onclick=()=>pick('Aprovado'); alt.onclick=()=>pick('Solicitar alteração');

  send.onclick=async()=>{
    if(choice!=='Aprovado' && ta.value.trim().length<3){msg.textContent='Descreva brevemente o que deseja alterar.';ta.focus();return}
    send.disabled=true; send.classList.add('load'); send.textContent='Enviando';
    const payload={cliente,video:`${n} · ${v.titulo}`,status:choice,alteracao:choice==='Aprovado'?'':ta.value.trim(),legenda:v.legenda,pagina:location.href.split('?')[0]};
    try{
      if(!CONFIG.ENDPOINT||CONFIG.ENDPOINT.startsWith('COLE_')) await new Promise(r=>setTimeout(r,900)); // modo demonstração
      else await fetch(CONFIG.ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      finish(true);
    }catch(err){
      send.classList.remove('load'); send.disabled=false; send.textContent='Confirmar resposta';
      msg.textContent='Não conseguimos enviar agora. Verifique sua conexão e tente novamente.';
    }
  };
  function finish(first){
    send.classList.remove('load'); send.textContent='Confirmar resposta';
    $('.stxt',el).textContent=choice==='Aprovado'?'Aprovado · enviado':'Alteração enviada';
    if(!el.classList.contains('done')){el.classList.add('done');done++;update()}
  }
  $('.again',el).onclick=()=>{el.classList.remove('done');done--;update();send.disabled=false};
}

function update(){
  $('#progTxt').textContent=`${done} / ${total}`;
  $('#progBar').style.setProperty('--p',total?done/total:0);
  const f=$('#finale'), all=done===total;
  f.classList.toggle('all',all);
  $('#finTitle').textContent=all?'Tudo certo. Obrigado!':'Cada detalhe importa.';
  $('#finText').textContent=all?'Recebemos todas as suas respostas e já damos sequência com a nossa equipe.':`Faltam ${total-done} ${total-done===1?'vídeo':'vídeos'} para concluir a sua aprovação.`;
}
update();

/* ---------- reveal + bar ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
addEventListener('scroll',()=>$('#bar').classList.toggle('solid',scrollY>40),{passive:true});

/* ---------- cursor glow ---------- */
const glow=$('#glow'); let gx=innerWidth/2,gy=innerHeight*.3,tx=gx,ty=gy;
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY},{passive:true});
(function g(){gx+=(tx-gx)*.07;gy+=(ty-gy)*.07;glow.style.left=gx+'px';glow.style.top=gy+'px';requestAnimationFrame(g)})();

/* ---------- gold dust ---------- */
const cv=$('#fx'),cx=cv.getContext('2d'); let W,H,P=[];
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);W/=d;H/=d;
  P=Array.from({length:Math.round(innerWidth/18)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,v:Math.random()*.25+.05,a:Math.random()*Math.PI*2,o:Math.random()*.5+.15}))}
addEventListener('resize',rs); rs();
(function loop(t){cx.clearRect(0,0,W,H);
  for(const p of P){p.y-=p.v;p.x+=Math.sin(t/3000+p.a)*.25;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    const tw=.5+.5*Math.sin(t/900+p.a);cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=`rgba(217,141,95,${p.o*tw})`;cx.fill()}
  requestAnimationFrame(loop)})(0);
})();
</script>
</body>
</html>
